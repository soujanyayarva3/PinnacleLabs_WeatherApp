<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta name="viewport"
  content="width=device-width, initial-scale=1.0">

  <title>Weather Dashboard</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

  <div class="container">

    <div class="weather-card">

      <h1>Weather Dashboard 🌦️</h1>

      <!-- Search -->

      <div class="search-box">

        <input type="text"
        id="cityInput"
        placeholder="Enter city name">

        <button onclick="getWeather()">

          Search

        </button>

      </div>

      <!-- Weather Info -->

      <div class="weather-info">

       <img
id="weatherIcon"
src=""
alt="">

        <h2 id="cityName">City Name</h2>

        <h3 id="temperature">--°C</h3>

        <p id="description">

          Weather Description

        </p>

        <div class="details">

          <div>

            <span>💧 Humidity</span>

            <p id="humidity">--%</p>

          </div>

          <div>

            <span>🌬️ Wind</span>

            <p id="wind">-- km/h</p>

          </div>

        </div>

      </div>

    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
